name: Build MikuHub

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml
      - name: Install Web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleOptimized --max-workers=1
      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: MikuHub-test-apks
          path: app/build/outputs/apk/optimized/*.apk
          if-no-files-found: error
